# Fork only: build every push to a feature/ or cmdr/ branch and keep the add-on
# as a workflow artifact (no release, no tag needed).
name: Build branch

on:
  push:
    branches:
      - 'feature/**'
      - 'cmdr/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # NVIDIA Streamline SDK (DLSS Frame Generation): headers for the build,
      # production DLLs shipped next to the add-on.
      - name: Get Streamline SDK
        shell: pwsh
        run: |
          $url = "https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.16/streamline-sdk-v2.14.16.zip"
          Invoke-WebRequest -Uri $url -OutFile sl.zip
          Expand-Archive sl.zip -DestinationPath third_party/streamline -Force
          Get-ChildItem third_party/streamline/include/sl_dlss_g.h

      - name: Build add-on
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '[^A-Za-z0-9.-]', '-'
          $v = "0.4.1-$v-$("${{ github.sha }}".Substring(0,7))"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DEDAA_VERSION=$v"
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Also commit the add-on to branch builds/<branch> (readable through the
      # git/contents API, unlike artifact storage).
      - name: Publish to builds branch
        shell: pwsh
        run: |
          $branch = "builds/${{ github.ref_name }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/EDAA.addon64 out/
          New-Item -ItemType Directory -Force out/streamline | Out-Null
          foreach ($f in "sl.interposer.dll","sl.common.dll","sl.dlss_g.dll","sl.reflex.dll","sl.pcl.dll","nvngx_dlssg.dll") {
            Copy-Item "build/Release/$f" out/streamline/
          }
          Set-Location out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          "${{ github.sha }}" | Out-File -Encoding ascii source_commit.txt
          git add -A
          git commit -q -m "Build of ${{ github.ref_name }} at ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"

      - uses: actions/upload-artifact@v4
        with:
          name: EDAA-addon
          path: |
            build/Release/EDAA.addon64
            build/Release/nvngx_dlss.dll
          retention-days: 14
